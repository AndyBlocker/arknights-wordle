# Install in the OpenResty http-context conf.d directory.
proxy_cache_path /www/cache/wordle-media levels=1:2 keys_zone=wordle_media:8m
    max_size=512m inactive=7d use_temp_path=off;

# Do not retain an upstream HTML error page returned with a successful status.
map $upstream_http_content_type $wordle_media_not_image {
    default 1;
    ~*^image/(png|jpeg|webp) 0;
}
