# Include inside the canonical mer.dev content server.
location ^~ /arknights-wordle/media/ {
    if ($uri !~ "^/arknights-wordle/media/[0-9a-f]/[0-9a-f]{2}/[^/]+\.(png|jpg|jpeg|webp|svg)$") {
        return 404;
    }
    limit_except GET {
        deny all;
    }

    rewrite ^/arknights-wordle/media/(.*)$ /$1? break;
    proxy_pass https://media.prts.wiki;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name media.prts.wiki;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    # Forward only the headers needed to retrieve a public image.
    proxy_pass_request_headers off;
    proxy_set_header Host media.prts.wiki;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Connection "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_hide_header Set-Cookie;

    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 12s;
    proxy_intercept_errors off;

    proxy_cache wordle_media;
    proxy_cache_key $uri;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_valid 200 1d;
    proxy_cache_revalidate on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Wordle-Image-Cache $upstream_cache_status always;
    add_header Strict-Transport-Security "max-age=31536000";
}
